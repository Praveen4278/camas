version: '3.9'

services:
  camas:
    build: .
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ./database:/app/database
      - ./reports:/app/reports
      - ./visualizations:/app/visualizations
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "uvicorn app:app --host 0.0.0.0 --port 8000"

  # Optional: Ollama service for local LLM serving
  # Uncomment to enable local model serving
